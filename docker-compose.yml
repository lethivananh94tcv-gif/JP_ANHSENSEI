version: '3.8'

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - anhsensei-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-postgres.vdzlkldjhxdzoztgcagy}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-duonggiakien}
      - JWT_SIGNING_SECRET=${JWT_SIGNING_SECRET:-default_dev_secret_key_32_characters_min}
      - SUPABASE_URL=${SUPABASE_URL:-https://vdzlkldjhxdzoztgcagy.supabase.co}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-dummy_key}
      - AI_API_KEY=${AI_API_KEY:-dummy_ai_key}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - anhsensei-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
    networks:
      - anhsensei-net

networks:
  anhsensei-net:
    driver: bridge
