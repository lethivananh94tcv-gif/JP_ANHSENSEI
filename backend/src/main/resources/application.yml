spring:
  application:
    name: anhsensei-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&characterEncoding=UTF-8}
    username: ${DATABASE_USERNAME:postgres.vdzlkldjhxdzoztgcagy}
    password: ${DATABASE_PASSWORD:duonggiakien}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    repair-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:lethivananh.94tcv@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:tjfzhilujxcxstqt}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:${BACKEND_PORT:8080}}
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SIGNING_SECRET:default_jwt_secret_must_be_overridden_in_env_file_32_chars}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  supabase:
    url: ${SUPABASE_URL:https://vdzlkldjhxdzoztgcagy.supabase.co}
    service-key: ${SUPABASE_SERVICE_KEY:dummy_key}
  ai:
    api-key: ${AI_API_KEY:dummy_ai_key}
    timeout-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
    db:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
