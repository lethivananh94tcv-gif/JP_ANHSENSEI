name: Render Backend Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (sleep threshold is 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -s -f https://anhsensei-backend.onrender.com/api/v1/actuator/health || echo "Backend is waking up..."
